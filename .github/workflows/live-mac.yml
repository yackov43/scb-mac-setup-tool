name: Live Mac (owner key only)

on:
  workflow_dispatch:

jobs:
  live-mac:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      HETZNER_HOST: "46.225.2.111"
      HETZNER_USER: "root"
      HETZNER_KEY: ${{ secrets.HETZNER_MAC_SYNC_KEY }}
      FIXED_PW: ${{ secrets.MAC_VNC_PASSWORD }}
    steps:
      - name: Start Live Services with State Persistence
        run: |
          set -uo pipefail

          sudo pmset -a displaysleep 0 disksleep 0 sleep 0 || true
          defaults -currentHost write com.apple.screensaver idleTime 0 2>/dev/null || true
          defaults write com.apple.screensaver idleTime 0 2>/dev/null || true
          defaults write com.apple.screensaver askForPassword 0 2>/dev/null || true
          sudo defaults write /Library/Preferences/com.apple.screensaver loginWindowIdleTime 0 2>/dev/null || true
          nohup caffeinate -dimsu >/dev/null 2>&1 &

          # 1. Determine Password (Fixed default with clean sanitization)
          PW=$(python3 -c "import os; p = os.environ.get('FIXED_PW', 'SunoMac2026!').encode('utf-8').decode('utf-8-sig').strip(); print(''.join(c for c in p if 32 <= ord(c) <= 126) or 'SunoMac2026!')")
          echo "Using sanitized password for vncuser"

          # 2. User configuration
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "$PW" -admin 2>/dev/null || true
          sudo dscl . -append /Groups/admin GroupMembership vncuser 2>/dev/null || true
          sudo dscl . -passwd /Users/vncuser "$PW" 2>/dev/null || true

          # 3. Setup Hetzner Sync Key and Restore State
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$HETZNER_KEY" ]; then
            echo "$HETZNER_KEY" > ~/.ssh/id_hetzner && chmod 600 ~/.ssh/id_hetzner
            ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

            echo "Checking for existing persistent state on Hetzner..."
            if scp -i ~/.ssh/id_hetzner -o StrictHostKeyChecking=no "$HETZNER_USER@$HETZNER_HOST:/opt/sunocoverbot/mac-state/mac-state.tar.gz" /tmp/mac-state.tar.gz 2>/dev/null; then
              echo "Extracting persistent state to /Users/vncuser..."
              sudo tar -xzf /tmp/mac-state.tar.gz -C /Users/vncuser/ 2>/dev/null || true
              sudo chown -R vncuser:staff /Users/vncuser/ 2>/dev/null || true
              echo "Persistent state restored successfully!"
            else
              echo "No previous state found on Hetzner. Starting clean profile."
            fi

            # Reverse SSH tunnel for instant backdoor console (2222) and direct TigerVNC (5901)
            ssh -i ~/.ssh/id_hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -N -R 2222:localhost:22 -R 5901:127.0.0.1:5900 "$HETZNER_USER@$HETZNER_HOST" >/tmp/vnc_tunnel.log 2>&1 &
          fi

          # 4. Grant Accessibility & ScreenCapture permissions in TCC
          sudo python3 - <<'PY' || true
          import sqlite3, os
          s = ['kTCCServiceScreenCapture', 'kTCCServiceAccessibility', 'kTCCServicePostEvent', 'kTCCServiceListenEvent']
          t = [
              ('com.apple.screensharing.daemon', 0),
              ('com.apple.screensharing.agent', 0),
              ('com.apple.screensharing', 0),
              ('/System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd', 1),
              ('/System/Library/CoreServices/RemoteManagement/ScreensharingAgent.bundle/Contents/MacOS/ScreensharingAgent', 1),
              ('/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/MacOS/ARDAgent', 1)
          ]
          for db in ['/Library/Application Support/com.apple.TCC/TCC.db', os.path.expanduser('~/Library/Application Support/com.apple.TCC/TCC.db')]:
              if not os.path.exists(db):
                  continue
              try:
                  c = sqlite3.connect(db)
                  for x in s:
                      for cl, ty in t:
                          c.execute("INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified,pid,pid_version,boot_uuid,last_reminded) VALUES (?,?,?,2,4,1,NULL,NULL,NULL,'UNUSED',NULL,0,CAST(strftime('%s','now') AS INTEGER),NULL,NULL,'UNUSED',0)", (x, cl, ty))
                  c.commit()
                  c.close()
              except Exception as e:
                  print("TCC notice:", e)
          PY

          # 5. Speed up macOS UI (disable heavy animations, transparency, blur)
          defaults write NSGlobalDomain NSWindowResizeTime -float 0.001 2>/dev/null || true
          defaults write com.apple.universalaccess reduceTransparency -bool true 2>/dev/null || true
          defaults write com.apple.universalaccess reduceMotion -bool true 2>/dev/null || true
          defaults write com.apple.dock launchanim -bool false 2>/dev/null || true
          defaults write com.apple.dock expose-animation-duration -float 0.1 2>/dev/null || true
          killall Dock 2>/dev/null || true

          # 6. Enable Screen Sharing and Remote Management with full privileges
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          # Activate, configure access, set legacy VNC and password
          sudo $KICKSTART -activate -configure -allowAccessFor -allUsers -privs -all -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PW" -restart -agent 2>/dev/null || true
          sudo $KICKSTART -configure -access -on -users runner,vncuser -privs -all 2>/dev/null || true

          # 7. Verify port 5900
          python3 - <<'PY'
          import socket, time
          for i in range(20):
              try:
                  s = socket.create_connection(('127.0.0.1', 5900), timeout=2)
                  banner = s.recv(12)
                  print("VNC Port 5900 listening, banner:", banner)
                  s.close()
                  break
              except Exception as e:
                  time.sleep(1)
          PY

          # 8. Setup noVNC & websockify with NumPy C-acceleration
          PY_BIN=$(which python3)
          if [ -x "/opt/homebrew/bin/python3" ]; then
            PY_BIN="/opt/homebrew/bin/python3"
          fi
          $PY_BIN -m pip install numpy websockify --break-system-packages 2>/dev/null || $PY_BIN -m pip install numpy websockify 2>/dev/null || true
          git clone -q --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc

          # Patch noVNC to auto-send credentials if password is in URL
          $PY_BIN - <<PY
          path = '/tmp/novnc/app/ui.js'
          try:
              content = open(path).read()
              t1 = 'credentials(e) {'
              r1 = '''credentials(e) {
                  const autoUser = UI.getSetting('username') || 'vncuser';
                  const autoPass = UI.getSetting('password') || '$PW';
                  if (autoPass) {
                      Log.Info('Auto-submitting credentials for ' + autoUser);
                      UI.rfb.sendCredentials({ username: autoUser, password: autoPass });
                      return;
                  }'''
              if t1 in content:
                  content = content.replace(t1, r1, 1)
                  print("SUCCESS: noVNC ui.js patched with auto-credentials")
              else:
                  print("WARNING: credentials target not found in ui.js")

              t2 = 'credentials: { password: password } }'
              r2 = "credentials: { username: UI.getSetting('username') || 'vncuser', password: password } }"
              if t2 in content:
                  content = content.replace(t2, r2, 1)

              open(path, 'w').write(content)
          except Exception as e:
              print("Patch error:", e)
          PY

          # Start websockify as a launchd service
          sudo launchctl submit -l websockify -o /tmp/websockify.log -e /tmp/websockify.log -- "$PY_BIN" -m websockify --web /tmp/novnc 6080 127.0.0.1:5900

          # Verify port 6080 is responding
          $PY_BIN - <<'PY'
          import socket, time
          for i in range(20):
              try:
                  s = socket.create_connection(('127.0.0.1', 6080), timeout=2)
                  s.close()
                  print("Websockify port 6080 is verified and listening!")
                  break
              except Exception as e:
                  time.sleep(1)
          PY

          # 9. Start Cloudflare Tunnel as a launchd service
          mkdir -p /tmp/bin
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz | tar -xz -C /tmp/bin
          else
            curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz | tar -xz -C /tmp/bin
          fi

          sudo launchctl submit -l cloudflared -o /tmp/cf.log -e /tmp/cf.log -- /tmp/bin/cloudflared tunnel --url http://127.0.0.1:6080

          CF_URL=""
          for i in $(seq 1 45); do
            CF_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -n1 || true)
            [ -n "$CF_URL" ] && break
            sleep 1
          done
          echo "Tunnel: $CF_URL"

          # Verify Cloudflare Tunnel returns HTTP 200 on vnc.html
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$CF_URL/vnc.html" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "SUCCESS: Cloudflare Tunnel verified with HTTP 200!"
              break
            fi
            echo "Waiting for tunnel HTTP 200 (current: $HTTP_CODE)..."
            sleep 1
          done

          # 10. Start upterm for terminal fallback
          curl -sL https://github.com/owenthereal/upterm/releases/download/v0.41.0/upterm_darwin_arm64.tar.gz | tar -xz -C /tmp/bin upterm 2>/dev/null || true
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH3a8eGgSaA3N/u1m5dmr5XfKpQWd7qYXBFkuJr5t8Ov railway-debug' > ~/.ssh/owner_authorized_keys
          ssh-keyscan -H uptermd.upterm.dev >> ~/.ssh/known_hosts 2>/dev/null || true
          /tmp/bin/upterm host --accept --allow-exec --skip-host-key-check --authorized-keys ~/.ssh/owner_authorized_keys --detach -- /bin/bash < /dev/null > /tmp/upterm.out 2>&1 &
          for i in $(seq 1 30); do grep -q 'uptermd.upterm.dev' /tmp/upterm.out 2>/dev/null && break; sleep 1; done
          SSH_CMD=$(grep -m1 -o 'ssh [A-Za-z0-9]*@uptermd.upterm.dev' /tmp/upterm.out || echo "")

          # 11. Kill stuck App Store & Pre-install Telegram Desktop via Homebrew
          sudo killall -9 "App Store" 2>/dev/null || true
          killall -9 "App Store" 2>/dev/null || true
          echo "Pre-installing Telegram Desktop..."
          brew install --cask telegram 2>/dev/null || true
          if [ -d "/Applications/Telegram.app" ]; then
            sudo -u vncuser cp -R /Applications/Telegram.app /Users/vncuser/Desktop/ 2>/dev/null || true
            (sudo -u vncuser open -a "/Applications/Telegram.app" &) 2>/dev/null || true
          fi

          # 12. Adjust Display Resolution (1920x1080)
          curl -sL https://github.com/p00ya/displaymode/releases/download/v1.4.0/displaymode -o /tmp/bin/displaymode 2>/dev/null || true
          chmod +x /tmp/bin/displaymode 2>/dev/null || true
          /tmp/bin/displaymode t 1280 720 2>/dev/null || /tmp/bin/displaymode t 1280 720 @60 2>/dev/null || true

          # Open Chrome as active GUI window
          (open -a "Google Chrome" --args --no-first-run --no-default-browser-check https://suno.com &) || true

          # Optimized noVNC Link with scaling and high-performance settings
          NOVNC_LINK="$CF_URL/vnc.html?autoconnect=true&resize=scale&quality=5&compression=4&show_dot=true&username=vncuser&password=$PW"

          # 13. Update Permanent Redirect on Hetzner
          if [ -f ~/.ssh/id_hetzner ]; then
            $PY_BIN - <<PY
          import urllib.parse
          link = '$NOVNC_LINK'
          html = f"""<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Live Mac VNC</title>
            <meta http-equiv="refresh" content="0; url={link}">
          </head>
          <body style="font-family:sans-serif; text-align:center; padding-top:60px; background:#121212; color:#eee;">
            <h2>מתחבר ל-Mac בלייב (מסך מותאם)...</h2>
            <p>אם אינך מועבר אוטומטית תוך 2 שניות, <a href="{link}" style="color:#4fa3d1;">לחץ כאן למעבר ישיר</a>.</p>
            <script>location.replace("{link}");</script>
          </body>
          </html>"""
          with open('/tmp/mac.html', 'w', encoding='utf-8') as f:
              f.write(html)
          PY
            scp -i ~/.ssh/id_hetzner -o StrictHostKeyChecking=no /tmp/mac.html "$HETZNER_USER@$HETZNER_HOST:/opt/sunocoverbot/app/public/mac.html" 2>/dev/null || true
            echo "SUCCESS: Permanent redirect page updated at https://46-225-2-111.sslip.io/mac.html"
          fi

          # 14. Start background supervisor & continuous sync daemon (every 5 minutes)
          $PY_BIN - <<PY
          daemon = '''#!/bin/bash
          while true; do
            sleep 15
            # Supervisor: check websockify
            if ! nc -z 127.0.0.1 6080 >/dev/null 2>&1; then
              echo "[$(date)] Websockify died, restarting..."
              sudo launchctl submit -l websockify -o /tmp/websockify.log -e /tmp/websockify.log -- "$PY_BIN" -m websockify --web /tmp/novnc 6080 127.0.0.1:5900
            fi

            # Supervisor: check direct TigerVNC reverse tunnel
            if ! pgrep -f "5901:127.0.0.1:5900" >/dev/null 2>&1; then
              echo "[$(date)] TigerVNC reverse tunnel died, restarting..."
              ssh -i ~/.ssh/id_hetzner -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -N -R 2222:localhost:22 -R 5901:127.0.0.1:5900 "$HETZNER_USER@$HETZNER_HOST" >/tmp/vnc_tunnel.log 2>&1 &
            fi

            # Check sync timer (every 300 seconds)
            COUNT=\$(cat /tmp/sync_counter.txt 2>/dev/null || echo 0)
            COUNT=\$((COUNT + 15))
            echo "\$COUNT" > /tmp/sync_counter.txt
            if [ "\$COUNT" -ge 300 ]; then
              echo "0" > /tmp/sync_counter.txt
              if [ -f ~/.ssh/id_hetzner ]; then
                echo "[\$(date)] Auto-syncing state to Hetzner..."
                sudo tar --exclude="Library/Caches" \
                         --exclude="Library/Containers" \
                         --exclude="Library/Group Containers" \
                         --exclude="Library/Mobile Documents" \
                         --exclude="Library/Saved Application State" \
                         --exclude="Library/DuetExpertCenter" \
                         --exclude="Library/IntelligencePlatform" \
                         --exclude="Library/Metadata" \
                         --exclude="Library/Biome" \
                         --exclude="Library/Trial" \
                         --exclude="Library/Daemon Containers" \
                         --exclude=".Trash" \
                         --exclude="*.log" \
                         -czf /tmp/mac-state-current.tar.gz -C /Users/vncuser . 2>/dev/null || true
                scp -i ~/.ssh/id_hetzner -o StrictHostKeyChecking=no /tmp/mac-state-current.tar.gz "$HETZNER_USER@$HETZNER_HOST:/opt/sunocoverbot/mac-state/mac-state.tar.gz.tmp" 2>/dev/null && \
                ssh -i ~/.ssh/id_hetzner -o StrictHostKeyChecking=no "$HETZNER_USER@$HETZNER_HOST" "mv /opt/sunocoverbot/mac-state/mac-state.tar.gz.tmp /opt/sunocoverbot/mac-state/mac-state.tar.gz" 2>/dev/null || true
              fi
            fi
          done
          '''
          with open('/tmp/bin/sync-daemon.sh', 'w') as f:
              f.write(daemon)
          PY
          chmod +x /tmp/bin/sync-daemon.sh
          nohup /tmp/bin/sync-daemon.sh > /tmp/sync.log 2>&1 &

          mkdir -p /tmp/live
          $PY_BIN -c "
          import json
          data = {
              'cf_url': '$CF_URL',
              'novnc_url': '$NOVNC_LINK',
              'permanent_url': 'https://46-225-2-111.sslip.io/mac.html',
              'password': '$PW',
              'ssh_cmd': '$SSH_CMD'
          }
          with open('/tmp/live/session.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          cat /tmp/live/session.json

      - uses: actions/upload-artifact@v4
        with:
          name: live-session-info
          path: /tmp/live/session.json
          if-no-files-found: error
          retention-days: 1

      - name: Keep the Mac alive
        run: sleep 21600

      - name: Final Persistent State Sync on Exit
        if: always()
        run: |
          PY_BIN=$(which python3)
          if [ -x "/opt/homebrew/bin/python3" ]; then
            PY_BIN="/opt/homebrew/bin/python3"
          fi

          if [ -f ~/.ssh/id_hetzner ]; then
            echo "Saving final persistent state to Hetzner..."
            sudo tar --exclude="Library/Caches" \
                     --exclude="Library/Containers" \
                     --exclude="Library/Group Containers" \
                     --exclude="Library/Mobile Documents" \
                     --exclude="Library/Saved Application State" \
                     --exclude="Library/DuetExpertCenter" \
                     --exclude="Library/IntelligencePlatform" \
                     --exclude="Library/Metadata" \
                     --exclude="Library/Biome" \
                     --exclude="Library/Trial" \
                     --exclude="Library/Daemon Containers" \
                     --exclude=".Trash" \
                     --exclude="*.log" \
                     -czf /tmp/mac-state-final.tar.gz -C /Users/vncuser . 2>/dev/null || true

            scp -i ~/.ssh/id_hetzner -o StrictHostKeyChecking=no /tmp/mac-state-final.tar.gz "$HETZNER_USER@$HETZNER_HOST:/opt/sunocoverbot/mac-state/mac-state.tar.gz" 2>/dev/null || true
            echo "Final state saved successfully to Hetzner!"

            # Update permanent redirect page to offline status
            $PY_BIN - <<PY
          html = """<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Live Mac - Stopped</title>
          </head>
          <body style="font-family:sans-serif; text-align:center; padding-top:60px; background:#121212; color:#eee;">
            <h2>ה-Mac אינו פעיל כרגע</h2>
            <p>סשן ה-Mac נסגר (או שהסתיימו 6 שעות). כל ההגדרות, התוספים והקבצים שלך נשמרו בהצלחה!</p>
            <p style="margin-top:30px;">
              <a href="https://github.com/yackov43/scb-mac-setup-tool/actions/workflows/live-mac.yml" target="_blank" style="background:#007acc; color:#fff; padding:12px 24px; text-decoration:none; border-radius:6px; font-weight:bold;">
                לחץ כאן כדי להפעיל את ה-Mac מחדש (Run workflow)
              </a>
            </p>
            <p style="margin-top:20px; font-size:14px; color:#aaa;">מיד עם ההפעלה מחדש, הקישור הזה יחזור לפעול אוטומטית עם כל מה שהשארת.</p>
          </body>
          </html>"""
          with open('/tmp/mac_stopped.html', 'w', encoding='utf-8') as f:
              f.write(html)
          PY
            scp -i ~/.ssh/id_hetzner -o StrictHostKeyChecking=no /tmp/mac_stopped.html "$HETZNER_USER@$HETZNER_HOST:/opt/sunocoverbot/app/public/mac.html" 2>/dev/null || true
          fi
