name: External extension enable probe (why can the externally installed extension not be accepted through the API?)

# Real macOS runner, fresh Chrome profile per case. Downloads only the public extension files from the production site.
# Time-boxed: script hard-exit 170 s per case, job 15 min, Chrome killed after each case. No endless loops.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clear the Homebrew download flag
        run: xattr -dr com.apple.quarantine "/Applications/Google Chrome.app" 2>/dev/null || true
      - name: Both variants
        run: |
          set +e
          for v in url crx; do
            VARIANT=$v node scripts/ci/external-enable-probe.mjs 2>&1 | grep -E "^(MANAGED|DEFAULTS|INFO|TRY|FNS|RESULT)|Error"
            pkill -KILL -f "Google Chrome.app/Contents/MacOS/Google Chrome" 2>/dev/null; sleep 2
          done
      - name: Cleanup
        if: always()
        run: pkill -KILL -f "Google Chrome" 2>/dev/null || true
